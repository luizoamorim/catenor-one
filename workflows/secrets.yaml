# ==========================================================================
# CRE SECRETS FILE — Catenor One identity-confidential
# ==========================================================================
# Maps the secret ID your workflow requests with `runtime.getSecrets([{id}])`
# to the environment variable holding its value.
#
# In a Confidential Workflow these are released by the Vault DON directly into
# the attested enclave — they are never exposed in plaintext to node operators
# or to Workflow DON node memory.
#
# S001 baseline: exactly 3 persistent secrets (PLAN §19.1).
# The *_VAR suffix is a harmless mitigation for a historical CLI substring bug.
secretsNames:
    SUMSUB_APP_TOKEN:
        - SUMSUB_APP_TOKEN_VAR
    SUMSUB_SECRET_KEY:
        - SUMSUB_SECRET_KEY_VAR
    CATENOR_INTERNAL_API_TOKEN:
        - CATENOR_INTERNAL_API_TOKEN_VAR
