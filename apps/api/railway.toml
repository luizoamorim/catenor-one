# Catenor One API service settings (prompt 024; docs/deployment/RAILWAY.md).
# NOT read by the production service: Railway deprecated Config as Code, and services created after 2026-08-28 cannot opt
# in. The same values are set in the Railway dashboard (RAILWAY.md §8, step 4); this file is their written record. The
# production service also sets the variable PORT=8080 (the domain's target port) and has auto deploy disabled.
# Migrations are NOT run automatically: the maintainer runs `prisma migrate deploy` from the service Console (step 6).

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
watchPatterns = [
  "apps/api/**",
  "packages/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  ".dockerignore",
]

[deploy]
healthcheckPath = "/v1/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# One instance: the CRE callback relay mailbox is in memory, so a callback and its pull must reach the same process.
numReplicas = 1
overlapSeconds = 0
drainingSeconds = 10
