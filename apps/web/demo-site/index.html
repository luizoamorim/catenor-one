<style>

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);grid-template-rows:var(--top) minmax(0,1fr);height:100vh;height:100dvh}

/* ---------- sidebar ---------- */
.side{grid-row:2;background:var(--soft2);border-right:1px solid var(--hair2);display:flex;flex-direction:column;min-height:0;overflow:auto}

.legend{margin-top:auto;padding:16px 22px 20px;border-top:1px solid var(--hair2)}

.legend ul{list-style:none;margin:0;padding:0}

kbd{font:600 10.5px var(--sans);border:1px solid var(--hair);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:#fff;color:#424245}

/* reality labels */
.rl{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#424245;border:1px solid var(--hair2);background:#fff;border-radius:999px;padding:2px 9px 2px 3px;cursor:help;white-space:nowrap;line-height:1.5}

/* ---------- main ---------- */
.main{grid-row:2;display:grid;grid-template-rows:minmax(0,1fr) var(--log);min-width:0;min-height:0}

.stage{
  --fg:#1d1d1f;--fg2:#424245;--fg3:#6e6e73;--fg4:#86868b;--line:#d2d2d7;--line2:#e8e8ed;--cv:#f5f5f7;--card:#fff;--card2:#fbfbfd;--ok:#16883f;--no:#d70015;--okbg:#e9f6ee;--nobg:#fdecee;
  min-height:0;display:grid;grid-template-columns:var(--ctl) minmax(0,1fr);gap:32px;padding:28px 32px 24px;background:var(--bg);color:var(--fg);transition:background .4s,color .4s}
.stage.dark{--fg:#f5f5f7;--fg2:#d2d2d7;--fg3:#a1a1a6;--fg4:#86868b;--line:#3a3a3c;--line2:#2c2c2e;--cv:#0b0b0c;--card:#161617;--card2:#1c1c1e;--ok:#30d158;--no:#ff453a;--okbg:rgba(48,209,88,.14);--nobg:rgba(255,69,58,.14);background:#000}

.canvas{position:relative;min-height:0;overflow:auto;background:var(--cv);border-radius:24px;padding:20px;scroll-behavior:smooth;scrollbar-width:thin;transition:background .4s}
.fade{animation:fadein .35s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* control column */
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12px;color:var(--fg4);font-weight:600;letter-spacing:.02em}

.ttl{margin:14px 0 0;font-size:40px;line-height:1.02;letter-spacing:-.055em;font-weight:700}

.acts{margin-top:22px;display:flex;flex-direction:column;gap:8px}

.act.neg:not([disabled]):hover{border-color:var(--no)}
.act.sec{background:var(--card);color:var(--blue);border-color:var(--line)}
.act.sec:not([disabled]):hover{border-color:var(--blue)}
.act[disabled]{cursor:not-allowed;background:var(--card2);color:var(--fg4);border-color:var(--line2)}
.act.did{background:var(--okbg);color:var(--ok);border-color:transparent;cursor:default}
.act.did.negd{background:var(--nobg);color:var(--no)}

.act .kb{font:600 10.5px var(--sans);border:1px solid rgba(255,255,255,.5);border-radius:5px;padding:1px 5px;margin-left:8px}

.inv{margin-top:22px;border-left:2px solid var(--fg);padding:2px 0 2px 14px}
.inv .k{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg4)}
.inv .v{margin-top:5px;font-size:17px;font-weight:650;letter-spacing:-.025em;line-height:1.25}
.inv .s{margin-top:5px;font-size:13px;line-height:1.5;color:var(--fg3)}
.proofs{margin-top:22px}
.proofs .k{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg4);margin-bottom:8px}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thumb{appearance:none;padding:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#f2f2f4;cursor:zoom-in;aspect-ratio:16/10;transition:transform .2s,box-shadow .2s}

/* canvas: idle, blocks */
.idle{height:100%;min-height:320px;display:grid;place-items:center;text-align:center;padding:30px}

.idle.sm{height:auto;min-height:0;padding:18px 20px 22px}
.idle.sm .big{font-size:64px}
.idle.sm .t1{margin-top:6px;font-size:19px}

/* first appearance of a sponsor: what it is · why we use it */
.intro{margin-bottom:14px;animation:fadein .35s ease both}
.intro-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:0 2px 10px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg4)}

.intro-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.spc{--acc:var(--c-cat);--tint:var(--t-cat);min-width:0;border:1px solid var(--line2);border-top:4px solid var(--acc);border-radius:16px;padding:14px 18px 16px;background:linear-gradient(180deg,var(--tint),var(--card) 62%)}
.spc.k-privy{--acc:var(--c-privy);--tint:var(--t-privy)}

.spc-t{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.spc-n{display:inline-flex;align-items:center;gap:9px;font-size:22px;font-weight:700;letter-spacing:-.035em;color:var(--acc)}
.spc-lg{width:24px;height:24px;object-fit:contain;flex:none}
.spc-lg.sq{border-radius:6px}
.spc-f{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:2px 8px;white-space:nowrap}
.spc-k{margin-top:10px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg4)}
.spc p{margin:3px 0 0;font-size:13.5px;line-height:1.45;color:var(--fg2)}
.spc ul{margin:4px 0 0;padding:0;list-style:none}
.spc li{position:relative;padding:3px 0 3px 14px;font-size:13px;line-height:1.4;color:var(--fg2)}
.spc li:before{content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.spc b{color:var(--fg);font-weight:650}
.blk{background:var(--card);border:1px solid var(--line2);border-radius:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.03);animation:fadein .3s ease both}
.bh{display:flex;align-items:center;gap:12px;padding:12px 16px 12px 18px}
.bh-t{appearance:none;flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;cursor:pointer;font-size:15px;font-weight:650;letter-spacing:-.015em;color:var(--fg)}
.bh-t .chev{flex:none;width:18px;color:var(--fg4);transition:transform .2s;font-size:15px;line-height:1}
.blk.col .bh-t .chev{transform:rotate(-90deg)}
.bh-t .ng{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--no)}
.bh-t .sum{font-size:12.5px;font-weight:500;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bh-m{flex:none;font-size:11.5px;color:var(--fg4);white-space:nowrap}
.bb{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:22px;padding:4px 18px 18px;border-top:1px solid var(--line2);padding-top:14px}
.blk.col .bb{display:none}

.deny{color:var(--no);background:var(--nobg)}

/* pipeline */
.pipe{list-style:none;margin:0;padding:0;min-width:0}
.ps{position:relative;display:grid;grid-template-columns:20px minmax(0,1fr);gap:11px;padding:5px 0 5px}
.ps:not(:last-child):before{content:"";position:absolute;left:9.5px;top:27px;bottom:-4px;width:1.5px;background:var(--line2)}
.ps .ic{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;margin-top:1px;transition:background .2s,border-color .2s}
.ps.run .ic{border-color:var(--line2);border-top-color:var(--blue);animation:spin .7s linear infinite}
.ps.ok .ic{background:var(--ok);border-color:var(--ok)}
.ps.ok .ic:after{content:"✓"}
.ps.deny .ic{background:var(--no);border-color:var(--no)}
.ps.deny .ic:after{content:"×";font-size:14px;line-height:1}
.ps.info .ic{background:var(--fg4);border-color:var(--fg4)}
.ps.info .ic:after{content:"i";font-family:Georgia,serif;font-style:italic}
.ps .pl{font-size:13px;font-weight:600;line-height:1.35;color:var(--fg);letter-spacing:-.005em}
.ps.wait .pl{color:var(--fg4);font-weight:500}
.ps.run .pl{color:var(--blue)}
.stage.dark .ps.run .pl{color:#64d2ff}
.ps .dt{font:10.5px/1.45 var(--mono);color:var(--fg3);margin-top:2px;overflow-wrap:anywhere}
.ps.wait .dt,.ps.run .dt{display:none}
.ps.deny .dt{color:var(--no)}
/* sponsor chips: the same name and accent wherever a system acts */
.sys{display:inline-flex;align-items:center;gap:4px;font:700 10px/1 var(--sans);letter-spacing:.01em;padding:3px 7px 3px 6px;border-radius:6px;margin-right:6px;vertical-align:1px;white-space:nowrap;color:#fff;background:var(--c-cat)}
.sys:before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7}
.s-cat{background:var(--c-cat);color:#fff}
.stage.dark .s-cat{background:#f5f5f7;color:#000}
.s-privy{background:var(--c-privy)}
.s-cre{background:var(--c-cre)}
.s-tee{background:var(--c-tee)}
.s-tee:before{background:#30d158;opacity:1}
.s-sumsub{background:var(--c-sum)}
.s-hedera{background:var(--c-hed)}
.s-mock{background:#fff3e0;color:#9a5b00}
.s-live{background:#e8f1fc;color:#0058b0}
.bys{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px}
.bys .sys{margin-right:0;font-size:9.5px}
.byk{font-size:10px;font-weight:600;color:var(--fg4);letter-spacing:.02em}
.byk + .sys{margin-left:1px}
.sys + .byk{margin-left:3px}
.rkr{display:flex;justify-content:space-between;align-items:center;gap:6px 10px;flex-wrap:wrap}
.by-cat{box-shadow:inset 3px 0 0 var(--c-cat)}
.stage.dark .by-cat{box-shadow:inset 3px 0 0 #f5f5f7}
.by-privy{box-shadow:inset 3px 0 0 var(--c-privy)}
.by-cre{box-shadow:inset 3px 0 0 var(--c-cre)}
.by-tee{box-shadow:inset 3px 0 0 var(--c-tee)}
.by-hedera{box-shadow:inset 3px 0 0 var(--c-hed)}
.by-sumsub{box-shadow:inset 3px 0 0 var(--c-sum)}
.ppol{display:inline-flex;align-items:stretch;border:1px solid rgba(109,53,232,.45);background:var(--t-privy);color:var(--fg);border-radius:6px;overflow:hidden;vertical-align:1px;max-width:100%}
.ppol b{flex:none;display:flex;align-items:center;font:700 9px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;background:var(--c-privy);color:#fff;padding:2px 6px}
.ppol span{padding:1px 6px;font-family:var(--mono);font-size:.95em;overflow-wrap:anywhere;min-width:0}
.stage.dark .ppol{background:rgba(109,53,232,.22);border-color:rgba(170,130,255,.55)}
.tee-h{font:700 9.5px/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--c-cre);padding:8px 0 2px 31px}
.stage.dark .tee-h{color:#8fa8f0}
.ps.tee{margin-left:0;background:linear-gradient(90deg,rgba(48,209,88,.07),transparent 80%);border-radius:8px}
.ps.tee .pl{padding-right:4px}
.pace{display:none;margin-top:6px;height:4px;border-radius:9px;background:var(--line2);overflow:hidden}
.ps.run .pace{display:block}
.pace i{display:block;height:100%;width:0;background:var(--blue);animation:pace var(--ms,1s) linear forwards}
.pacetx{display:none;font:11px/1.5 var(--mono);color:var(--blue);margin-top:4px}
.ps.run .pacetx{display:block}
@keyframes pace{to{width:100%}}

/* results */
.res{min-width:0}
.res.in > *{animation:rise .45s ease both}
.res.in > *:nth-child(2){animation-delay:.08s}.res.in > *:nth-child(3){animation-delay:.16s}.res.in > *:nth-child(4){animation-delay:.24s}.res.in > *:nth-child(5){animation-delay:.32s}.res.in > *:nth-child(6){animation-delay:.4s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.res-wait{height:100%;min-height:180px;display:grid;place-items:center;border:1.5px dashed var(--line);border-radius:14px;font-size:13px;color:var(--fg4);background:linear-gradient(90deg,transparent 0%,var(--line2) 50%,transparent 100%) 0 0/200% 100%;animation:shim 1.6s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
.res > * + *{margin-top:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rc{background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:14px 16px;min-width:0}
.rc.hl{background:var(--card);border-color:var(--line)}
.rk{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--fg4)}
.rv{margin-top:6px;font-size:18px;font-weight:650;letter-spacing:-.025em;line-height:1.25;overflow-wrap:anywhere}
.rv.h,.rv .h{font-size:13px;font-weight:500;letter-spacing:0;line-height:1.5}
.rs{margin-top:6px;font-size:12.5px;line-height:1.5;color:var(--fg3);overflow-wrap:anywhere}
.rs b{color:var(--fg)}
.huge{font-size:52px;font-weight:700;letter-spacing:-.06em;line-height:.95}
.okc{color:var(--ok)}
.noc{color:var(--no)}
.kvs{margin:8px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 14px;font-size:12.5px;line-height:1.5}
.kvs dt{color:var(--fg4);padding:4px 0;border-top:1px solid var(--line2);white-space:nowrap}
.kvs dd{margin:0;padding:4px 0;border-top:1px solid var(--line2);color:var(--fg);overflow-wrap:anywhere;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font:11px/1.4 var(--mono);background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:4px 8px;color:var(--fg)}
.chip .y{color:var(--ok);font-weight:700;font-family:var(--sans)}
.chip .n0{color:var(--no);font-weight:700;font-family:var(--sans)}
.chip.bad{border-color:rgba(215,0,21,.3);background:var(--nobg)}
.caprow{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.capl{font-size:12px;color:var(--fg3)}
.dtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 12px;flex-wrap:wrap}
.denyres{border:1px solid rgba(215,0,21,.22);background:var(--nobg);border-radius:16px;padding:18px 20px}
.denyres .huge{color:var(--no)}
.denyres .dcode{font:600 15px var(--mono);color:var(--no);margin-top:6px}
.denyres p{margin:10px 0 0;font-size:13.5px;line-height:1.5;color:var(--fg2)}
.allowres{border:1px solid rgba(22,136,63,.22);background:var(--okbg);border-radius:16px;padding:18px 20px}
.allowres .huge{color:var(--ok)}
.caps{list-style:none;margin:8px 0 0;padding:0}
.caps li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line2);font-size:13px}
.caps li code{font-size:12px;font-weight:600;color:var(--fg)}
.caps li .r{font:11px var(--mono);color:var(--fg3)}
.facts2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}

/* investors */
.inv-c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.inv-h{display:flex;align-items:center;gap:12px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;color:#fff;flex:none}
.av.a{background:linear-gradient(135deg,#ffb340,#ff7a00)}
.av.b{background:linear-gradient(135deg,#5ac8fa,#0071e3)}
.inv-h .nm{font-size:16px;font-weight:650;letter-spacing:-.02em}
.inv-h .al{font-size:11.5px;color:var(--fg4)}
.st-pill{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:999px;white-space:nowrap}
.g-green{background:var(--okbg);color:var(--ok)}
.g-red{background:var(--nobg);color:var(--no)}
.units{margin-top:10px;font-size:30px;font-weight:700;letter-spacing:-.05em}
.units small{font-size:13px;font-weight:500;color:var(--fg3);letter-spacing:0;margin-left:6px}

/* ownership */
.own{display:grid;height:12px;border-radius:999px;overflow:hidden;background:var(--line2);margin-top:10px}
.own div:first-child{background:#ff9f0a}
.own div:last-child{background:#0a84ff}
.own-l{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--fg3)}

/* transactions */
.txr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)}
.txr:first-child{border-top:0}
.txn{font-size:13.5px;font-weight:600}
.txm{font-size:12px;color:var(--fg3);margin-top:2px}
.txh{font-size:12px;margin-top:3px}
.txa{display:flex;gap:8px;align-items:center;justify-self:end}
.lnk{font-size:12.5px;color:var(--blue);font-weight:600;white-space:nowrap}
.stage.dark .lnk{color:#64d2ff}
.lnk:hover{text-decoration:underline}
.vbtn{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--blue);cursor:pointer;white-space:nowrap}
.stage.dark .vbtn{color:#64d2ff}
.vbtn:hover{border-color:var(--blue)}
.vbtn[disabled]{color:var(--fg4);cursor:progress}
.vout{grid-column:1/-1;font:11px/1.6 var(--mono);color:var(--fg2)}
.vout:empty{display:none}
.vout .ok{color:var(--ok);font-weight:700}
.vout .bad{color:var(--no);font-weight:700}
.vout .err{font-family:var(--sans);font-size:12.5px;color:#9a5b00}
.stage.dark .vout .err{color:#ffd60a}

/* policy viewer */
.pv{border:1.5px solid var(--c-privy);border-radius:16px;background:var(--card);overflow:hidden;box-shadow:0 0 0 4px var(--t-privy)}
.pv-band{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;padding:9px 14px;background:var(--t-privy);border-bottom:1px solid rgba(109,53,232,.22);font-size:13px;color:var(--c-privy)}
.pv-band b{font-weight:700;letter-spacing:-.01em}
.pv-band .pv-n{color:#1d1d1f}
.pv-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.pv-n{font:600 13px var(--mono);overflow-wrap:anywhere}
.pv-i{font-size:11.5px;color:var(--fg3);margin-top:2px}
.seg{display:inline-flex;background:var(--line2);border-radius:9px;padding:2px;flex:none}
.seg button{appearance:none;border:0;background:none;border-radius:7px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--fg3);cursor:pointer}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pv-rules{padding:4px 14px 12px;box-shadow:inset 3px 0 0 var(--c-privy)}
.pv-rk{padding:8px 0 2px;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--c-privy)}
.rule{padding:10px 0;border-top:1px solid var(--line2)}
.pv-rk + .rule{border-top:0}
.rule.later{opacity:.42}
.rule.fresh{background:linear-gradient(90deg,rgba(109,53,232,.08),transparent);margin:0 -14px;padding:10px 14px}
.rule-t{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px}
.rule-t .rn{font:600 12px var(--mono)}
.rule-t .rm{color:var(--fg4);font-size:11.5px}
.rule-t .lt{font-size:10.5px;font-weight:600;color:var(--c-privy)}
.conds{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin-top:8px}
.cond{border:1px solid var(--line2);border-radius:10px;padding:6px 10px;background:var(--card2);min-width:0}
.cond .v{font-size:13px;font-weight:650;letter-spacing:-.01em}
.cond .f{font:10.5px/1.4 var(--mono);color:var(--fg4);overflow-wrap:anywhere;margin-top:1px}
.and{align-self:center;color:var(--fg4);font-size:14px}
.code{margin:0;background:var(--card2);padding:14px 16px;overflow:auto;max-height:340px;font:11.5px/1.6 var(--mono);color:var(--fg);tab-size:2;white-space:pre}
.code .k{font-weight:600}
.code .s{color:#c41a16}
.code .n{color:#1c00cf}
.code .b{color:#9b2393}
.code .p{color:var(--fg4)}
.stage.dark .code .s{color:#ff8170}
.stage.dark .code .n{color:#d9c97c}
.pv-f{padding:8px 14px;border-top:1px solid var(--line2);font-size:11.5px;color:var(--fg3)}

/* authority chain */
.chain{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr) 28px minmax(0,1fr);align-items:stretch}
.node{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);min-width:0}
.node .t{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--fg4)}
.node .nm{margin-top:4px;font-size:15px;font-weight:650;letter-spacing:-.02em}
.node .d{margin-top:4px;font:10.5px/1.5 var(--mono);color:var(--fg3);overflow-wrap:anywhere}
.node.on{border-color:var(--ok);box-shadow:0 0 0 3px var(--okbg)}
.arr{display:grid;place-items:center;color:var(--fg4);font-size:18px}

/* distribution reveal */
.reveal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.rvb{border-radius:18px;padding:18px 20px;border:1px solid var(--line2);background:var(--card2);min-width:0}
.rvb .who{font-size:12.5px;color:var(--fg3)}
.rvb .dec{margin-top:6px;font-size:76px;font-weight:700;letter-spacing:-.07em;line-height:.9}
.rvb.pay .dec{color:var(--ok)}
.rvb.hold .dec{color:var(--no)}
.rvb .tr{margin-top:12px;font-size:12.5px;line-height:1.55;color:var(--fg2)}
.rvb .then{margin-top:12px;padding-top:10px;border-top:1px solid var(--line2);font-size:13px;line-height:1.5;color:var(--fg)}
.res.in .rvb .dec{animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both}
.res.in .rvb.hold .dec{animation-delay:.25s}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.foot-k{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:11.5px;color:var(--fg3)}
.foot-k b{color:var(--fg2);font-weight:600}

/* done banner */
.nextbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px 14px 20px;border-radius:16px;background:var(--card);border:1px solid var(--line2);animation:fadein .35s ease both}
.nextbar .l{font-size:14px;font-weight:600;color:var(--ok)}
.nextbar .l span{color:var(--fg3);font-weight:500}
.nextbar button{appearance:none;border:0;background:#1d1d1f;color:#fff;border-radius:999px;padding:9px 18px;font-size:13.5px;font-weight:600;cursor:pointer}
.stage.dark .nextbar button{background:#f5f5f7;color:#000}

/* dashboard (step 10) */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--card);border:1px solid var(--line2);border-radius:18px;overflow:hidden}
.kpi{padding:16px 18px;border-right:1px solid var(--line2);min-width:0}
.kpi:last-child{border-right:0}
.kpi b{display:block;font-size:34px;letter-spacing:-.055em;line-height:1;font-weight:700}
.kpi > span:not(.bys){display:block;margin-top:6px;font-size:12px;line-height:1.35;color:var(--fg3)}
.kpi .bys{margin-top:8px}
.dash{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px;align-items:start}
.pan{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:14px 18px;min-width:0}
.pan + .pan{margin-top:14px}
.pan-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.pan-h > b{font-size:15px;letter-spacing:-.02em}
.pan-h > span:not(.bys){font-size:11.5px;color:var(--fg4)}
.crer{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line2);font-size:12.5px}
.crer:first-of-type{border-top:0}
.crer .sg{font-weight:700;color:var(--fg3)}
.crer .op{font:600 11.5px var(--mono);overflow-wrap:anywhere}
.crer .id{font-size:11px;color:var(--fg3);margin-top:2px}
.crer .rr{text-align:right;font-size:12px;white-space:nowrap}
.aud{list-style:none;margin:6px 0 0;padding:0}
.aud li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line2);font-size:12.5px}
.aud li:first-child{border-top:0}
.bals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.balc{border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:var(--card2)}
.balc .n{font-size:11.5px;color:var(--fg4)}
.balc b{display:block;font-size:24px;letter-spacing:-.04em;margin-top:4px}
.balc p{margin:4px 0 0;font-size:11.5px;color:var(--fg3);line-height:1.45}
.histlink{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:14px;padding:18px 22px;border-radius:18px;background:#1d1d1f;color:#fff}
.histlink b{font-size:20px;letter-spacing:-.03em}
.histlink small{display:block;margin-top:2px;font-size:13px;color:#a1a1a6}
.histlink em{font-style:normal;font-size:22px}

/* ---------- activity log ---------- */
.log{display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--hair2);background:#fff;transition:background .4s}
.log-h{flex:none;display:flex;align-items:center;gap:12px;height:40px;padding:0 20px;border-bottom:1px solid var(--hair2)}
.log-h b{font-size:12.5px;letter-spacing:-.01em}
.log-h .c{font-size:11px;font-weight:700;background:var(--soft);border-radius:999px;padding:2px 8px;color:var(--muted)}
.log-h .lg-note{font-size:11.5px;color:var(--muted2)}
.log-h .tg{margin-left:auto;appearance:none;border:0;background:none;font-size:12px;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:8px}
.log-h .tg:hover{background:var(--soft)}
.log-l{flex:1;min-height:0;overflow:auto;padding:4px 0 8px;scroll-behavior:smooth}
.lg{display:grid;grid-template-columns:78px 128px minmax(0,1fr);gap:12px;align-items:baseline;padding:4px 20px;font-size:12.5px;line-height:1.45;color:#424245}
.lg .tm{font:11.5px var(--mono);color:var(--muted2)}
.lg .sy{justify-self:start}
.lg .ms{overflow-wrap:anywhere}
.lg.ok .ms:before{content:"✓ ";color:var(--green);font-weight:700}
.lg.deny .ms:before{content:"✕ ";color:var(--red);font-weight:700}
.lg.warn .ms:before{content:"! ";color:#9a5b00;font-weight:700}
.lg.new{animation:flash 1.4s ease}
@keyframes flash{from{background:#e8f1fc}to{background:transparent}}
.log-empty{padding:14px 20px;font-size:12.5px;color:var(--muted2)}
.main.dark .log{background:#0b0b0c;border-top-color:#2c2c2e}
.main.dark .log-h{border-bottom-color:#2c2c2e}
.main.dark .log-h b{color:#f5f5f7}
.main.dark .log-h .c{background:#1c1c1e;color:#a1a1a6}
.main.dark .lg{color:#d2d2d7}
.main.dark .lg.new{animation:flashd 1.4s ease}
.main.dark .log .s-cat{background:#f5f5f7;color:#000}
@keyframes flashd{from{background:#1c2a3a}to{background:transparent}}

/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,10px);background:#1d1d1f;color:#fff;font-size:13px;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .2s,transform .2s;z-index:700;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* lightbox (from history.html) */
.lb{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;grid-template-rows:1fr auto;padding:56px 64px 22px;gap:14px}
.lb figure{margin:0;min-height:0;display:grid;place-items:center}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#111}
.lb .cap{max-width:980px;margin:0 auto;color:#d2d2d7;font-size:14px;line-height:1.5;text-align:center}
.lb .cap .cnt{display:block;margin-top:4px;font-size:12px;color:#86868b}
.lb-btn{position:absolute;appearance:none;border:0;background:rgba(255,255,255,.14);color:#fff;width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:22px;line-height:42px;text-align:center}
.lb-btn:hover{background:rgba(255,255,255,.26)}
.lb-close{top:12px;right:14px}
.lb-prev{left:12px;top:50%;margin-top:-21px}
.lb-next{right:12px;top:50%;margin-top:-21px}

/* ---------- responsive ---------- */
@media(max-width:1600px){:root{--ctl:370px;--side:264px}.ttl{font-size:36px}}
@media(max-width:1280px){
  :root{--ctl:330px;--side:236px}
  .bb{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}

function chk(t, bad){ return '<span class="chip' + (bad ? ' bad' : '') + '">' + (bad ? '<span class="n0">✕</span>' : '<span class="y">✓</span>') + t + '</span>'; }
function hl(src){
  var out = '', last = 0, m, re = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\b\d+(?:\.\d+)?\b)|([{}\[\],])/g;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += m[2] ? '<span class="k">' + esc(m[1]) + '</span><span class="p">' + esc(m[2]) + '</span>' : '<span class="s">' + esc(m[1]) + '</span>';

    else if (m[4]) out += '<span class="n">' + m[4] + '</span>';
    else out += '<span class="p">' + esc(m[5]) + '</span>';
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

    .then(function(r){ clearTimeout(timer); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }, function(e){ clearTimeout(timer); throw e; });
}
function verifyTx(btn){
  var hash = btn.getAttribute('data-verify'), out = btn.closest('.txr').querySelector('.vout');
  if (!/^0x[0-9a-fA-F]{64}$/.test(hash)) return Promise.resolve(false);
  btn.disabled = true; btn.textContent = 'Checking…'; out.textContent = '';
  return fetchJson(MIRROR + 'contracts/results/' + hash).then(function(d){
    out.innerHTML = '';
    var ok = d.result === 'SUCCESS', l1 = document.createElement('div'), l2 = document.createElement('div');
    var r = document.createElement('span'); r.className = ok ? 'ok' : 'bad'; r.textContent = (ok ? '✓ ' : '✕ ') + (d.result || '—');
    l1.appendChild(r);
    var bits = [];
    if (d.block_number != null) bits.push('block ' + d.block_number);
    if (d.gas_used != null) bits.push('gas ' + Number(d.gas_used).toLocaleString('en-US'));
    if (d.timestamp) { var t = parseFloat(d.timestamp); if (isFinite(t)) bits.push(new Date(t * 1000).toISOString().replace('T', ' ').replace(/\.\d+Z$/, ' UTC')); }
    l1.appendChild(document.createTextNode(' · live from the Mirror Node · ' + bits.join(' · ')));
    l2.textContent = 'from ' + describeAddr(d.from) + ' → to ' + describeAddr(d.to);
    out.appendChild(l1); out.appendChild(l2);
    addLog('live', 'HEDERA', 'Mirror Node: ' + hx(hash, 4, 4) + ' → ' + (d.result || '—') + (d.block_number != null ? ' · block ' + d.block_number : ''), ok ? 'ok' : 'warn');
    return ok;
  }).catch(function(e){
    out.innerHTML = '';
    var s = document.createElement('span'); s.className = 'err';
    s.appendChild(document.createTextNode('Could not reach the Mirror Node from this browser (' + (e && e.name === 'AbortError' ? 'timeout' : (e && e.message) || 'network or CORS error') + '). '));
    var a = document.createElement('a'); a.className = 'lnk'; a.rel = 'noopener'; a.target = '_blank'; a.href = hs(hash); a.textContent = 'Open it on HashScan ↗';
    s.appendChild(a); out.appendChild(s);
    addLog('live', 'HEDERA', 'Mirror Node unreachable for ' + hx(hash, 4, 4) + ' — use HashScan', 'warn');
    return false;
  }).then(function(v){ btn.disabled = false; btn.textContent = 'Verify again'; return v; });
}
function checkBalances(){
  var box = $('bal-out'); if (!box) return Promise.resolve();
  var accts = [[D.acct.a, 'Lisa · Investor A', '7.0 ℏ at the end of the run (1 activation + 6 payout)'], [D.acct.b, 'Bart · Investor B', '1.0 ℏ at the end of the run (activation only)']];
  box.innerHTML = accts.map(function(a){ return '<div class="balc"><div class="n">' + a[1] + ' · ' + a[0] + '</div><b>…</b><p>Checking the Mirror Node…</p></div>'; }).join('');
  return Promise.all(accts.map(function(a){ return fetchJson(MIRROR + 'accounts/' + a[0]).then(function(d){ return { a: a, d: d }; }, function(e){ return { a: a, e: e }; }); })).then(function(res){
    box.innerHTML = '';
    res.forEach(function(r){
      var c = document.createElement('div'); c.className = 'balc';
      var n = document.createElement('div'); n.className = 'n'; n.textContent = r.a[1] + ' · ' + r.a[0];
      var b = document.createElement('b'), p = document.createElement('p');
      if (r.d && r.d.balance && typeof r.d.balance.balance === 'number') {
        b.textContent = (r.d.balance.balance / 1e8).toFixed(8).replace(/0+$/, '').replace(/\.$/, '.0') + ' ℏ';
        p.textContent = 'Live now. Recorded: ' + r.a[2] + '.';
        addLog('live', 'HEDERA', 'Mirror Node balance ' + r.a[0] + ' (' + r.a[1] + '): ' + b.textContent, 'ok');
      } else {
        b.textContent = '—';
        p.textContent = 'Could not read the Mirror Node (' + ((r.e && r.e.message) || 'unexpected response') + '). ';
        var l = document.createElement('a'); l.className = 'lnk'; l.rel = 'noopener'; l.target = '_blank'; l.href = 'https://hashscan.io/testnet/account/' + r.a[0]; l.textContent = 'HashScan ↗'; p.appendChild(l);
        addLog('live', 'HEDERA', 'Mirror Node unreachable for ' + r.a[0] + ' — use HashScan', 'warn');
      }
      c.appendChild(n); c.appendChild(b); c.appendChild(p); box.appendChild(c);
    });
  });
}

/* ---------- lightbox ---------- */
var lb = $('lb'), lbImg = $('lb-img'), lbCap = $('lb-cap'), lbClose = $('lb-close'), lbPrev = $('lb-prev'), lbNext = $('lb-next');
var lbGroup = [], lbIdx = 0, lbLast = null;
function lbShow(){
  var id = lbGroup[lbIdx], m = IMG[id];
  lbImg.src = 'assets/' + id + '.jpg'; lbImg.alt = m[2];
  lbCap.innerHTML = esc(m[2]) + '<span class="cnt">' + (lbGroup.length > 1 ? (lbIdx + 1) + ' / ' + lbGroup.length + ' · ← → to browse · ' : '') + 'Esc to close · screenshot from the recorded run</span>';
  lbPrev.hidden = lbNext.hidden = lbGroup.length < 2;
}
function lbOpen(btn){
  var g = btn.getAttribute('data-group');
  lbGroup = Array.prototype.map.call(document.querySelectorAll('[data-lb][data-group="' + g + '"]'), function(b){ return b.getAttribute('data-lb'); });
  lbIdx = Math.max(0, lbGroup.indexOf(btn.getAttribute('data-lb')));
  lbLast = btn; lbShow(); lb.hidden = false; document.documentElement.style.overflow = 'hidden'; lbClose.focus();
}
function lbHide(){ lb.hidden = true; lbImg.src = 'data:,'; document.documentElement.style.overflow = ''; if (lbLast && document.body.contains(lbLast)) lbLast.focus(); }
function lbStep(d){ lbIdx = (lbIdx + d + lbGroup.length) % lbGroup.length; lbShow(); }
lbClose.addEventListener('click', lbHide);
lbPrev.addEventListener('click', function(){ lbStep(-1); });
lbNext.addEventListener('click', function(){ lbStep(1); });
lb.addEventListener('click', function(e){ if (e.target === lb || e.target.id === 'lb-fig') lbHide(); });

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target : null; if (!t) return;
  var el;
  if ((el = t.closest('[data-step]'))) { go(+el.getAttribute('data-step'), true); return; }
  if ((el = t.closest('[data-go]'))) { e.preventDefault(); go(+el.getAttribute('data-go'), true); return; }
  if ((el = t.closest('[data-nav]'))) { go(state.cur + (+el.getAttribute('data-nav')), true); return; }
  if ((el = t.closest('[data-act]'))) {
    var st = STEPS[state.cur], a = actBy(st, el.getAttribute('data-act'));
    if (a && a.custom) a.custom(el); else if (a) runAction(state.cur, a);
    return;
  }
  if ((el = t.closest('[data-toggle-blk]'))) { var b = el.closest('.blk'); b.classList.toggle('col'); el.setAttribute('aria-expanded', String(!b.classList.contains('col'))); return; }
  if ((el = t.closest('[data-pvmode]'))) {
    var pv = el.closest('.pv'), json = el.getAttribute('data-pvmode') === 'json';
    pv.querySelector('.pv-rules').hidden = json; pv.querySelector('.pv-json').hidden = !json;
    Array.prototype.forEach.call(pv.querySelectorAll('[data-pvmode]'), function(x){ var on = x === el; x.classList.toggle('on', on); x.setAttribute('aria-pressed', String(on)); });
    return;
  }
  if ((el = t.closest('[data-verify]'))) { verifyTx(el); return; }
  if ((el = t.closest('[data-lb]'))) { lbOpen(el); return; }
  if ((el = t.closest('[data-copy]'))) { copy(el.getAttribute('data-copy')); return; }
});
$('log-tg').addEventListener('click', function(){
  var min = elMain.classList.toggle('logmin');
  this.textContent = min ? 'Show' : 'Hide'; this.setAttribute('aria-expanded', String(!min));
});
document.addEventListener('keydown', function(e){
  if (!lb.hidden) {
    if (e.key === 'Escape') { e.preventDefault(); lbHide(); }
    else if (e.key === 'ArrowRight' && lbGroup.length > 1) lbStep(1);
    else if (e.key === 'ArrowLeft' && lbGroup.length > 1) lbStep(-1);
    else if (e.key === 'Tab') { var f = [lbClose, lbPrev, lbNext].filter(function(b){ return !b.hidden; }), i = f.indexOf(document.activeElement); e.preventDefault(); f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus(); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var tg = e.target, tag = tg && tg.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (tg && tg.isContentEditable)) return;
  if (e.key === 'ArrowRight') {
    e.preventDefault();
    if (state.cur < STEPS.length - 1 && unlocked(state.cur + 1)) go(state.cur + 1, true);
    else if (state.cur < STEPS.length - 1) { var np = nextPending(state.cur); toast(np ? 'Next action: ' + np.label + ' (↵)' : 'Complete this step first'); }
  } else if (e.key === 'ArrowLeft') { e.preventDefault(); go(state.cur - 1, true); }
  else if (e.key === 'Enter') {
    if (tag === 'BUTTON' || tag === 'A') return;
    var a = nextPending(state.cur);
    if (a) { e.preventDefault(); runAction(state.cur, a); }
    else if (STEPS[state.cur].actions[0] && STEPS[state.cur].actions[0].custom && !running) { e.preventDefault(); STEPS[state.cur].actions[0].custom(); }
  }
});

/* ---------- init ---------- */
(function init(){
  var saved = load(); if (saved) state = saved;
  var q = location.search.match(/[?&]done=(\d+)/);
  if (q) {
    state = fresh();
    var n = Math.min(+q[1], STEPS.length);
    for (var i = 0; i < n; i++) completeInstantly(i, true);
    state.cur = Math.min(Math.max(n - 1, 0), STEPS.length - 1);
    var o = location.search.match(/[?&]open=(\d+)/); if (o) state.cur = Math.min(+o[1] - 1, STEPS.length - 1);
    save();
  }
  var hm = location.hash.match(/^#step-(\d+)$/);
  if (hm && !q) { var hi = +hm[1] - 1; if (hi >= 0 && hi < STEPS.length && unlocked(hi)) state.cur = hi; }
  if (!unlocked(state.cur)) state.cur = 0;
  renderLegend(); renderLog(); render(false);
  if (history.replaceState) history.replaceState(null, '', location.pathname + location.search + '#step-' + (state.cur + 1));
})();
})();
</script>
